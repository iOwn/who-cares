# Dependency freshness. See docs/testing.md "Dependency freshness".
#
# One grouped weekly PR for non-major (minor + patch) bumps; every major bump
# gets its own PR (majors are excluded from the groups, so Dependabot opens them
# individually). Security updates stay on — they are enabled by default and are
# not disabled here. Every PR rides the same CI gate, so a bad bump can't
# self-merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # `@types/node` tracks the runtime major (`engines.node` is 22.x, CI on 22):
    # types for a newer Node than we run can typecheck APIs that don't exist at
    # runtime. Majors are bumped by hand together with the runtime; minor/patch
    # still flow through the group above.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
