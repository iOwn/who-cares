<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Nunito", system-ui, sans-serif; color: #23201b; }
    a { color: #3d7dd8; } a:hover { color: #2f63ad; }
    .disp { font-family: "Baloo 2", sans-serif; }
    .sect { font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #a49c8d; margin: 20px 0 8px; }
    .wd { width: 40px; height: 40px; border-radius: 12px; border: 2px solid #ded7c8; background: #fff; display: flex; align-items: center; justify-content: center; font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 13px; }
    .wd.on { background: #3d7dd8; border-color: #23201b; color: #fff; box-shadow: 0 2px 0 #23201b; }
    .lbl { display: block; font-size: 11px; font-weight: 800; color: #8a8378; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.03em; }
    .field { width: 100%; border: 2px solid #ded7c8; border-radius: 11px; padding: 11px 12px; font-family: "Nunito", sans-serif; font-size: 14px; font-weight: 700; background: #fff; color: #23201b; }
    .clo { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid #ded7c8; border-radius: 12px; padding: 10px 11px; margin-bottom: 8px; }
    .btn { font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 15px; border: 3px solid #23201b; border-radius: 14px; background: #3d7dd8; color: #fff; padding: 13px; cursor: pointer; width: 100%; box-shadow: 0 4px 0 #23201b; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fbfaf7; overflow: hidden; position: relative;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 16px 0;">
    <button style="width: 34px; height: 34px; border: 2px solid #23201b; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#23201b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="disp" style="font-weight: 800; font-size: 19px;">Carlito&rsquo;s childcare</div>
  </div>

  <div style="padding: 0 16px;">

    <div class="sect" style="margin-top: 18px;">Which days need pickup</div>
    <div style="font-size: 12px; font-weight: 600; color: #6b655b; margin-bottom: 10px;">The weekdays Carlito is normally in daycare.</div>
    <div style="display: flex; gap: 7px;">
      <div class="wd on">M</div>
      <div class="wd on">T</div>
      <div class="wd on">W</div>
      <div class="wd on">T</div>
      <div class="wd">F</div>
    </div>

    <span class="lbl">Effective from</span>
    <div class="field">Mon 1 Sep 2026</div>
    <div style="font-size: 11px; font-weight: 600; color: #a49c8d; margin-top: 5px;">Earlier weeks keep whatever pattern was in effect then.</div>

    <div class="sect">Closures</div>

    <div class="clo">
      <span style="width: 32px; height: 32px; border-radius: 9px; background: #f1ede4; display: flex; align-items: center; justify-content: center; flex: none; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 12px; color: #8a8378;">10</div>
      <div style="flex-grow: 1;"><div style="font-size: 13px; font-weight: 800;">Thu 10 Sep 2026</div><div style="font-size: 11px; font-weight: 600; color: #a49c8d;">Daycare closed &mdash; staff training day</div></div>
      <button style="border: none; background: none; color: #c23f2c; font-weight: 800; font-size: 12px; cursor: pointer;">Remove</button>
    </div>

    <div class="clo">
      <span style="width: 32px; height: 32px; border-radius: 9px; background: #f1ede4; display: flex; align-items: center; justify-content: center; flex: none; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 12px; color: #8a8378;">22</div>
      <div style="flex-grow: 1;"><div style="font-size: 13px; font-weight: 800;">Tue 22 Dec 2026</div><div style="font-size: 11px; font-weight: 600; color: #a49c8d;">Winter break starts</div></div>
      <button style="border: none; background: none; color: #c23f2c; font-weight: 800; font-size: 12px; cursor: pointer;">Remove</button>
    </div>

    <button style="width: 100%; border: 2px dashed #ded7c8; border-radius: 12px; background: none; padding: 11px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 13px; color: #6b655b; cursor: pointer;">+ Add a closure</button>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; background: linear-gradient(180deg, rgba(251,250,247,0), #fbfaf7 24%);">
    <button class="btn">Save changes</button>
  </div>

</div>
</x-dc>
</body>
</html>
